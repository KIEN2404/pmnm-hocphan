<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/bmi" method="POST">
        <label>chieu cao </label>
        <input type="text" name="cao"> <br>
        <label>can nang </label>
        <input type="text" name="nang"> <br>
        {% if error["in"] %}
           <h1>{{error["in"]}}</h1>
        {% elif error["cao"]  %}
            <h1>{{error["cao"]}}</h1>
        {% elif error["nang"] %}
            <h1>{{error["nang"]}}</h1>
        {% else %}
            <h1>BMI = {{values["bmi"]}}</h1>
            <h1>Xep loai: {{values["xeploai"]}}</h1>
            <h1>{{values["mau"]}}</h1>
        {% endif %}
        
        <br>
        <input type="submit" value="Tính toán">
    </form>
</body>
</html>
