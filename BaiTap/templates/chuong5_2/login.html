<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Đăng nhập</title></head>
<body>
  <h2>Đăng nhập</h2>
  {% for category, msg in get_flashed_messages(with_categories=true) %}
    <p>{{ msg }}</p>
  {% endfor %}
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="POST">
    <input type="text" name="user" placeholder="Tên đăng nhập" required><br><br>
    <input type="password" name="pass" placeholder="Mật khẩu" required><br><br>
    <button type="submit">Đăng nhập</button>
  </form> <br>
  <a href="{{ url_for('register') }}">Đăng ký</a>
</body>
</html>
