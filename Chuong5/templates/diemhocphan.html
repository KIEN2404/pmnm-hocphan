<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/" method="POST"> 
        <input type="text" name="cc"> <br>
        <input type="text" name="gk"> <br>
        <input type="text" name="ck"> <br>
        
        {% if error["in"] %}
           <h1>{{error["in"]}}</h1>
        {% elif error["cc"]  %}
            <h1>{{error["cc"]}}</h1>
        {% elif error["gk"] %}
            <h1>{{error["gk"]}}</h1>
        {% elif error["ck"] %}
            <h1>{{error["ck"]}}</h1>
        {% else %}
            <h1>{{values["dtb"]}}</h1>
            <h1>{{values["xeploai"]}}</h1>
        {% endif %}

         

        <input type="submit" value="Tính toán">
    </form>
</body>
</html>
